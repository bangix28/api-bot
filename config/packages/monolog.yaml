monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - riot    # Appels à l'API Riot (Infrastructure) — injecté via $riotLogger ou #[WithMonologChannel('riot')]
        - refresh # Jobs de refresh (Application + Commands) — injecté via $refreshLogger

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # Erreurs HTTP : silencieux tant que tout va bien, dump complet (debug inclus)
            # dès qu'une error survient. Les channels applicatifs en sont exclus car
            # fingers_crossed jetterait leurs warnings s'il n'y a pas d'error dans la requête.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
                channels: ["!riot", "!refresh", "!deprecation"]
            # rotating_file (et non php://stderr) : la prod est un VPS nginx + PHP-FPM
            # sans Docker, stderr y est perdu. max_files gère la rotation sans logrotate.
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/prod.log"
                max_files: 14
                level: debug
            # Signaux métier (appels Riot, jobs de refresh) : écrits sans condition dès info.
            app:
                type: rotating_file
                path: "%kernel.logs_dir%/app.log"
                max_files: 14
                level: info
                channels: ["riot", "refresh"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/deprecation.log"
                max_files: 7
                channels: [deprecation]
