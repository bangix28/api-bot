security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: argon2id
            migrate_from:
                - bcrypt
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        # Joueurs connectés par Discord : reconstruits depuis leur JWT, sans base.
        player_provider:
            id: App\Infrastructure\Security\PlayerUserProvider
        # L'API accepte les deux : comptes e-mail (identifiant = e-mail) et
        # joueurs (identifiant = « discord:<id> »). Chacun ignore l'autre.
        api_user_provider:
            chain:
                providers: [app_user_provider, player_provider]
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # Agent de LAN : authentifié par son jeton « agt_… » (contrat de l'agent, § 1).
        # Avant « main », qui couvre tout ^/api. L'appairage (device, token) reste
        # sous « main », public : l'agent n'a pas encore de jeton à ce moment-là.
        agent:
            pattern: ^/api/agent/v1/(session|reports)
            stateless: true
            provider: player_provider
            access_token:
                token_handler: App\Infrastructure\Security\AgentAccessTokenHandler
                failure_handler: App\Infrastructure\Security\AgentAuthenticationResponder
            entry_point: App\Infrastructure\Security\AgentAuthenticationResponder
        main:
            pattern: ^/api
            stateless: true
            provider: api_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~

        api:
            pattern: ^/api/
            stateless: true
            provider: app_user_provider
            jwt: ~

        admin:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_admin_login
                default_target_path: admin
                check_path: app_admin_login
                enable_csrf: true
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route
            remember_me:
                secret: '%kernel.secret%' # required
                lifetime: 604800 # 1 week in seconds



    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
       - { path: ^/api/riot-account, roles: ROLE_API }
       - { path: ^/api/history-account-lol, roles: ROLE_API }
       # Avant le catch-all ^/api (PUBLIC_ACCESS) : seule la première règle qui matche compte.
       # ^/api/ranked (sans suffixe) : couvre /ranked-race, /ranked-race-events ET la route
       # item auto-générée par API Platform (/ranked_race_events/{id}, avec underscores).
       - { path: ^/api/ranked, roles: ROLE_API }
       - { path: ^/api/users, roles: ROLE_API }
       - { path: ^/api/login, roles: PUBLIC_ACCESS }
       - { path: ^/api/auth/discord, roles: PUBLIC_ACCESS }
       # Profil et comptes du joueur connecté : un compte e-mail n'en a pas.
       - { path: ^/api/me, roles: ROLE_PLAYER }
       # Défis de LAN : le parcours d'un joueur n'appartient qu'à lui ; le
       # catalogue, le classement et le fil s'affichent aussi sur l'écran de la
       # LAN, servi par le compte API du front.
       - { path: ^/api/lan-events/\d+/me, roles: ROLE_PLAYER }
       - { path: ^/api/(lan-events|lan-challenges), roles: [ROLE_API, ROLE_PLAYER] }
       - { path: ^/api/agent/v1/(session|reports), roles: ROLE_AGENT }
       - { path: ^/admin, roles: ROLE_ADMIN }
       - { path: ^/refresh, roles: ROLE_ADMIN }
       - { path: ^/getDailyElo, roles: ROLE_ADMIN }
       - { path: ^/register, roles: ROLE_ADMIN }
       - { path: ^/api, roles: PUBLIC_ACCESS } # Allows accessing the Swagger UI docs

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
