nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        # If-None-Match doit être autorisé, sinon le préflight rejette toute
        # requête conditionnelle ; ETag doit être exposé, sinon le JavaScript
        # du front lit null et ne peut pas la construire.
        allow_headers: ['Content-Type', 'Authorization', 'If-None-Match']
        expose_headers: ['Link', 'ETag']
        max_age: 3600
    paths:
        '^/': null
