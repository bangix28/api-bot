# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.riot.api.token: '%env(RIOT_API_TOKEN)%'
    # Fuseau des fenêtres de course, indépendant de celui du serveur : les bornes
    # sont civiles (lundi 00:00 à Paris). Sur un VPS en UTC, une game de dimanche
    # 23h30 basculerait sinon dans la semaine suivante.
    app.timezone: 'Europe/Paris'
    # Suspension de la course Progression pendant la fenêtre de placements de début
    # de saison (les deltas y seraient absurdes). Passer à 1 dans .env.local, puis
    # cache:clear ; repasser à 0 une fois les inscrits majoritairement placés.
    # Le classement Winrate, lui, continue pendant la suspension.
    env(RANKED_RACE_PROGRESSION_SUSPENDED): '0'
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Câblage explicite des channels Monolog par nom de paramètre.
            # (Le matching implicite par nom d'alias est déprécié depuis Symfony 8.1,
            # et #[Target] importerait du Symfony dans la couche Application.)
            Psr\Log\LoggerInterface $refreshLogger: '@monolog.logger.refresh'
            Psr\Log\LoggerInterface $riotLogger: '@monolog.logger.riot'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
    # Câblé explicitement plutôt que par un bind global : « $timezone » est un nom
    # trop courant pour être capté à l'échelle du conteneur.
    App\Infrastructure\Shared\SystemClock:
        arguments:
            $timezone: '%app.timezone%'

    App\Application\RankedRace\ComputeStandings\ComputeRankedRaceStandingsHandler:
        arguments:
            $progressionSuspended: '%env(bool:RANKED_RACE_PROGRESSION_SUSPENDED)%'

    App\Application\RankedRace\ComputeEventStandings\ComputeEventStandingsHandler:
        arguments:
            $progressionSuspended: '%env(bool:RANKED_RACE_PROGRESSION_SUSPENDED)%'

    # Deux implémentations existent (l'adaptateur Doctrine et l'objet nul qui
    # sert de défaut aux tests) : sans cet alias l'autowiring est ambigu, retombe
    # silencieusement sur l'objet nul, et l'affinage de la date de départ ne fait
    # plus rien — sans qu'aucun test ne le voie.
    App\Domain\RankedRace\FirstRankedGameFinderInterface:
        alias: App\Infrastructure\RankedRace\DoctrineFirstRankedGameFinder

    App\Domain\User\UserRepositoryInterface:
        alias: App\Infrastructure\User\DoctrineUserRepository


    # Hasher concret de Symfony, injecté dans l'adaptateur SymfonyPasswordHasher
    Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher: ~
    Symfony\Component\PasswordHasher\PasswordHasherInterface:
        alias: Symfony\Component\PasswordHasher\Hasher\NativePasswordHasher

    # Port domaine → adaptateur Infrastructure (et non le hasher Symfony directement,
    # qui n'implémente pas l'interface du domaine)
    App\Domain\User\PasswordHasherInterface:
        alias: App\Infrastructure\User\SymfonyPasswordHasher
